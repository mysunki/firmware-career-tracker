name: Refresh job listings
on:
  schedule:
    - cron: '17 0,3,6,9,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public job feeds
        env:
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
        run: |
          python scripts/update_jobs.py
          python scripts/watch_companies.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/watch_results.json
          git diff --cached --quiet || (git commit -m 'data: refresh job listings' && git push)
